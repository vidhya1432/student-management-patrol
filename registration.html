<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Registration | Student Management Portal</title>
</head>
<body>
  <header>
    <h1>Student Management Portal</h1>
    <nav>
      <a href="index.html">Home</a> |
      <a href="about.html">About</a> |
      <a href="registration.html">Student Registration</a> |
      <a href="courses.html">Courses</a> |
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <h2>Student Registration</h2>
    <form>
      <p><label for="name">Full name:</label><br>
      <input type="text" id="name" name="name" required></p>

      <p><label for="email">Email:</label><br>
      <input type="email" id="email" name="email" required></p>

      <p><label for="student-id">Student ID:</label><br>
      <input type="text" id="student-id" name="student-id" required></p>

      <p><label for="course">Choose a course:</label><br>
      <select id="course" name="course" required>
        <option value="">Select a course</option>
        <option value="computer-science">Computer Science</option>
        <option value="information-technology">Information Technology</option>
        <option value="business">Business Administration</option>
      </select></p>

      <button type="submit">Register</button>
    </form>
  </main>

  <footer><p>Student Management Portal | 26CS102</p></footer>
</body>
</html>
